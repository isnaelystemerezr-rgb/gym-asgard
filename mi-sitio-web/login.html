<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Inicia sesión en tu cuenta de Gym Asgard y accede a tu plan de entrenamiento.">
  <meta name="keywords" content="login, iniciar sesión, asgard, gimnasio">
  <meta name="author" content="Tu Nombre">
  <title>Iniciar sesión | Gym Asgard</title>
  <link rel="stylesheet" href="estilos.css">
</head>
<body>

  <header>
    <h1>⚔️ Gym Asgard</h1>
    <nav>
      <a href="index.html">Inicio</a>
      <a href="sobre.html">Sobre nosotros</a>
      <a href="servicios.html">Servicios</a>
      <a href="contacto.html">Contacto</a>
      <a href="login.html">Iniciar sesión</a>
    </nav>
  </header>

  <main>
    <section class="login-section">
      <div class="login-caja">

        <h2>Iniciar sesión</h2>
        <p class="intro">Accede a tu cuenta para ver tu plan y reservar clases.</p>

        <form class="formulario" action="#" method="post">

          <label for="usuario">Correo o usuario</label>
          <input type="text" id="usuario" name="usuario" placeholder="tucorreo@ejemplo.com" required>

          <label for="password">Contraseña</label>
          <input type="password" id="password" name="password" placeholder="••••••••" required minlength="6">

          <div class="login-opciones">
            <label class="check">
              <input type="checkbox" id="recordarme" name="recordarme">
              Recordarme
            </label>
            <a href="#" class="link-olvido">¿Olvidaste tu contraseña?</a>
          </div>

          <button type="submit" class="btn">Entrar</button>
        </form>

        <p class="registro">
          ¿No tienes cuenta? <a href="contacto.html">Regístrate</a>
        </p>

      </div>
    </section>
  </main>

  <footer>
    <p>&copy; 2026 Gym Asgard. Todos los derechos reservados.</p>
  </footer>

</body>
</html>
